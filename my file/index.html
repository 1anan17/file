<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林思源 · 首页 | 全栈架构师</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #07090f;
            color: #eef2ff;
            line-height: 1.5;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f111a; }
        ::-webkit-scrollbar-thumb { background: #c9a03d; border-radius: 8px; }

        /* 导航栏（公用样式，四个页面保持一致） */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(7, 9, 15, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(201, 160, 61, 0.3);
            padding: 1rem 2rem;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f5e7c8, #e3b873);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        .nav-links a {
            color: #cbd5e6;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
            padding: 0.4rem 0;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #e3b873;
            border-bottom: 2px solid #e3b873;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        .card {
            background: rgba(12, 16, 28, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            border: 1px solid rgba(227, 184, 115, 0.25);
            padding: 2.5rem;
        }
        .hero {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
        }
        .hero-content { flex: 1; }
        .hero-badge {
            display: inline-block;
            background: rgba(227, 184, 115, 0.15);
            border-left: 3px solid #e3b873;
            padding: 0.3rem 1rem;
            font-size: 0.8rem;
            color: #e3b873;
            margin-bottom: 1.2rem;
            border-radius: 0 16px 16px 0;
        }
        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #d6c294);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.8rem;
        }
        .hero-tagline {
            font-size: 1.3rem;
            color: #bfc9e0;
            margin-bottom: 1rem;
            border-left: 3px solid #e3b873;
            padding-left: 1rem;
        }
        .hero-desc {
            color: #9aa4bf;
            margin-bottom: 1.8rem;
            max-width: 90%;
        }
        .btn-gold {
            background: #e3b873;
            color: #0a0c15;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            margin-right: 1rem;
            transition: 0.2s;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #e3b873;
            color: #e3b873;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }
        .btn-gold:hover { background: #f0ca8a; transform: translateY(-2px); }
        .btn-outline:hover { background: rgba(227, 184, 115, 0.1); }
        .avatar {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #1a2438, #0b0e18);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e3b873;
            box-shadow: 0 0 30px rgba(227, 184, 115, 0.2);
        }
        .avatar span { font-size: 5rem; font-weight: 700; color: #e3b873; }
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid rgba(227, 184, 115, 0.2);
            color: #8592b0;
        }
        @media (max-width: 768px) {
            .container { padding: 1.5rem; }
            .hero { flex-direction: column-reverse; text-align: center; }
            .hero-tagline { border-left: none; text-align: center; }
            .hero-desc { max-width: 100%; }
            .nav-container { flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">✦ LI.SIYUAN</div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">首页</a></li>
                <li><a href="about.html">关于我</a></li>
                <li><a href="projects.html">项目经历</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
        </div>
    </nav>
    <main class="container">
        <div class="card">
            <div class="hero">
                <div class="hero-content">
                    <div class="hero-badge">🏆 伦敦设计奖 · 灵感启发</div>
                    <h1>林思源 <span style="color:#e3b873;">LEO</span></h1>
                    <div class="hero-tagline">全栈架构师 · 体验驱动创新</div>
                    <p class="hero-desc">3年全栈经验，重构优雅的数字化产品，让代码成为艺术的载体。善于构建高性能Web应用，荣获企业级最佳交互提名。</p>
                    <div>
                        <a href="projects.html" class="btn-gold">✨ 探索作品集</a>
                        <a href="contact.html" class="btn-outline">💬 创意碰撞</a>
                    </div>
                </div>
                <div class="avatar"><span>林</span></div>
            </div>
        </div>
    </main>
    <footer>
        <p>© 2025 林思源 · 以创意交互为驱动 | 融合伦敦设计奖美学体系</p>
    </footer>
</body>
</html>
