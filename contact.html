<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>联系方式 | 林思源</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, sans-serif;
            background: #07090f;
            color: #eef2ff;
            line-height: 1.5;
        }
        .navbar {
            background: rgba(7, 9, 15, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(201, 160, 61, 0.3);
            padding: 1rem 2rem;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f5e7c8, #e3b873);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        .nav-links a {
            color: #cbd5e6;
            text-decoration: none;
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #e3b873;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        .card {
            background: rgba(12, 16, 28, 0.7);
            border-radius: 2rem;
            border: 1px solid rgba(227, 184, 115, 0.25);
            padding: 2.5rem;
        }
        .section-title {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(120deg, #fff, #e3b873);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .contact-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
        }
        .contact-info {
            flex: 1;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px dashed rgba(227, 184, 115, 0.3);
        }
        .contact-icon {
            width: 44px;
            height: 44px;
            background: rgba(227, 184, 115, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #e3b873;
        }
        .contact-text h4 {
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        .contact-text a, .contact-text p {
            color: #bfc9e0;
            text-decoration: none;
        }
        .contact-text a:hover {
            color: #e3b873;
        }
        .contact-form {
            flex: 1;
            background: rgba(8, 11, 20, 0.6);
            padding: 1.5rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(227, 184, 115, 0.2);
        }
        .contact-form h3 {
            margin-bottom: 1rem;
            color: #e3b873;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: rgba(20, 25, 40, 0.8);
            border: 1px solid rgba(227, 184, 115, 0.3);
            border-radius: 1rem;
            color: white;
            font-family: inherit;
        }
        .btn-submit {
            background: #e3b873;
            width: 100%;
            border: none;
            padding: 0.8rem;
            font-weight: 700;
            border-radius: 2rem;
            color: #0f111a;
            cursor: pointer;
        }
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid rgba(227, 184, 115, 0.2);
            color: #8592b0;
        }
        @media (max-width: 768px) {
            .nav-container { flex-direction: column; }
            .contact-wrapper { flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">✦ LI.SIYUAN</div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我</a></li>
                <li><a href="projects.html">项目经历</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
        </div>
    </nav>
    <main class="container">
        <div class="card">
            <h2 class="section-title">⎯ 联系方式 ⎯</h2>
            <div class="contact-wrapper">
                <div class="contact-info">
                    <div class="contact-item">
                        <div class="contact-icon">✉️</div>
                        <div class="contact-text">
                            <h4>邮箱</h4>
                            <a href="mailto:siyuan.lin@example.com">siyuan.lin@example.com</a>
                        </div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-icon">🐙</div>
                        <div class="contact-text">
                            <h4>GitHub</h4>
                            <a href="#">github.com/leo_siyuan</a>
                        </div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-icon">💼</div>
                        <div class="contact-text">
                            <h4>领英</h4>
                            <a href="#">linkedin.com/in/siyuan-lin</a>
                        </div>
                    </div>
                </div>
                <div class="contact-form">
                    <h3>✉️ 发送消息</h3>
                    <form id="contactForm">
                        <div class="form-group">
                            <input type="text" id="name" placeholder="姓名" required>
                        </div>
                        <div class="form-group">
                            <input type="email" id="email" placeholder="邮箱" required>
                        </div>
                        <div class="form-group">
                            <textarea rows="3" id="message" placeholder="留言内容"></textarea>
                        </div>
                        <button type="submit" class="btn-submit">发送</button>
                    </form>
                    <p id="formFeedback" style="margin-top: 0.8rem; font-size: 0.8rem; color: #e3b873;"></p>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>© 2025 林思源</p>
    </footer>
    <script>
        const form = document.getElementById('contactForm');
        const feedback = document.getElementById('formFeedback');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const msg = document.getElementById('message').value.trim();
            if (!name || !email || !msg) {
                feedback.textContent = '请填写所有字段';
                setTimeout(() => feedback.textContent = '', 2000);
                return;
            }
            feedback.textContent = '消息已发送（演示模式）感谢联系！';
            form.reset();
            setTimeout(() => feedback.textContent = '', 3000);
        });
    </script>
</body>
</html>
